name: Metrics

# METRICS_TOKEN einmalig selbst anlegen (der Workflow kann das Secret nicht erstellen):
#
# 1. GitHub → Settings → Developer settings → Personal access tokens
#    → Tokens (classic) → Generate new token (classic).
#    Fine-grained Tokens (Präfix github_pat_) lehnt Metrics ab.
# 2. Keine Scopes setzen. Ohne Scopes liest das Token nur öffentliche Daten.
#    Den Scope "repo" weglassen, damit private Repositories nicht in der Grafik landen.
# 3. In DIESEM Repository: Settings → Secrets and variables → Actions
#    → New repository secret
#    Name:  METRICS_TOKEN
#    Wert:  das classic Token
# 4. Nach dem Merge auf main: Actions → Metrics → Run workflow
#
# PageSpeed-Adresse ändern: unten bei PAGESPEED_URL eine andere https-URL eintragen.
# Ein Google-PageSpeed-API-Key ist optional. Ohne Key nutzt der Lauf das öffentliche
# Kontingent und kann an das Rate-Limit laufen; dann bleibt die Platzhalterkarte stehen.
# Key anlegen: https://developers.google.com/speed/docs/insights/v5/get-started
# Secret-Name: PAGESPEED_TOKEN
#
# Der Lauf ist täglich (05:00 UTC; GitHub kann den Start verzögern) und zusätzlich
# manuell über workflow_dispatch. Jeder Schritt committet eine eigene SVG-Datei.
# Bis zum ersten erfolgreichen Lauf zeigen die README-Bilder die mitgelieferten Karten.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

env:
  # Hier die geprüfte Seite tauschen. Mit https:// beginnen.
  PAGESPEED_URL: https://ps-bauen.de
  METRICS_CSS: >-
    svg{background:#0d1117;color:#c9d1d9}
    h1,h2,h3{color:#58a6ff!important}
    h1 svg,h2 svg,h3 svg{fill:#58a6ff!important}
    .field{color:#c9d1d9}
    footer{color:#8b949e!important}
    :root{
      --color-calendar-graph-day-bg:#161b22;
      --color-calendar-graph-day-L1-bg:#0e4429;
      --color-calendar-graph-day-L2-bg:#006d32;
      --color-calendar-graph-day-L3-bg:#26a641;
      --color-calendar-graph-day-L4-bg:#39d353
    }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: METRICS_TOKEN prüfen
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Repository-Secret METRICS_TOKEN fehlt. Classic-Token ohne Scopes anlegen (kein Fine-grained Token, kein repo-Scope) und unter Settings → Secrets and variables → Actions speichern."
            exit 1
          fi

      - name: Isometrischer Kalender
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: David-van-der-Meulen
          template: classic
          base: ""
          filename: assets/metrics-isocalendar.svg
          config_timezone: Europe/Berlin
          config_display: regular
          plugins_errors_fatal: yes
          extras_css: ${{ env.METRICS_CSS }}
          committer_message: "chore: aktualisiere Isokalender [Skip GitHub Action]"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Jahreskalender
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: David-van-der-Meulen
          template: classic
          base: ""
          filename: assets/metrics-calendar.svg
          config_timezone: Europe/Berlin
          config_display: regular
          plugins_errors_fatal: yes
          extras_css: ${{ env.METRICS_CSS }}
          committer_message: "chore: aktualisiere Beitragskalender [Skip GitHub Action]"
          plugin_calendar: yes
          # 0 = alle Jahre seit der Registrierung. 1 = nur das laufende Jahr.
          plugin_calendar_limit: 0

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: David-van-der-Meulen
          template: classic
          base: ""
          filename: assets/metrics-achievements.svg
          config_timezone: Europe/Berlin
          config_display: regular
          plugins_errors_fatal: yes
          extras_css: ${{ env.METRICS_CSS }}
          committer_message: "chore: aktualisiere Achievements [Skip GitHub Action]"
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no

      - name: Issues, Pull Requests und Projekte
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: David-van-der-Meulen
          template: classic
          base: ""
          filename: assets/metrics-followup.svg
          config_timezone: Europe/Berlin
          config_display: regular
          plugins_errors_fatal: no
          extras_css: ${{ env.METRICS_CSS }}
          committer_message: "chore: aktualisiere Follow-up [Skip GitHub Action]"
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_archived: no
          plugin_projects: yes
          plugin_projects_limit: 4

      - name: PageSpeed
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: David-van-der-Meulen
          template: classic
          base: ""
          filename: assets/metrics-pagespeed.svg
          config_display: regular
          plugins_errors_fatal: yes
          extras_css: ${{ env.METRICS_CSS }}
          committer_message: "chore: aktualisiere PageSpeed [Skip GitHub Action]"
          plugin_pagespeed: yes
          plugin_pagespeed_url: ${{ env.PAGESPEED_URL }}
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
