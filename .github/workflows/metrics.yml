name: Metrics

# METRICS_TOKEN einmalig selbst anlegen (der Workflow kann das Secret nicht erstellen):
#
# 1. GitHub → Settings → Developer settings → Personal access tokens
#    → Tokens (classic) → Generate new token (classic).
#    Fine-grained Tokens (Präfix github_pat_) lehnt Metrics ab.
# 2. Keine Scopes setzen. Ohne Scopes liest das Token nur öffentliche Daten.
#    Den Scope "repo" weglassen, damit private Repositories nicht in der Grafik landen.
# 3. In DIESEM Repository: Settings → Secrets and variables → Actions
#    → New repository secret
#    Name:  METRICS_TOKEN
#    Wert:  das classic Token
# 4. Nach dem Merge auf main: Actions → Metrics → Run workflow
#
# Der Lauf ist täglich (05:00 UTC; GitHub kann den Start verzögern) und zusätzlich
# manuell über workflow_dispatch. Die Action committet assets/github-metrics.svg.
# Bis zum ersten erfolgreichen Lauf zeigt die README die mitgelieferte Grafik.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: METRICS_TOKEN prüfen
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Repository-Secret METRICS_TOKEN fehlt. Classic-Token ohne Scopes anlegen (kein Fine-grained Token, kein repo-Scope) und unter Settings → Secrets and variables → Actions speichern."
            exit 1
          fi

      - name: Metrics erzeugen und committen
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: David-van-der-Meulen
          template: terminal
          filename: assets/github-metrics.svg
          base: header, activity, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
          config_timezone: Europe/Berlin
          plugins_errors_fatal: no
          committer_message: "chore: aktualisiere GitHub-Metrics [Skip GitHub Action]"
