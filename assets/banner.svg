    .d3 { animation-duration: 2.3s; animation-delay: -0.5s; }
    .d4 { animation-duration: 3.6s; animation-delay: -2.1s; }
    @media (prefers-reduced-motion: reduce) {
      .drip { animation: none; }
    }
  </style>
